# =============================================================================
# Default values for platform-service-channel.
# Auto-generated by scripts/generate-helm.sh from deploy/.env.prod
# =============================================================================

replicaCount: 1
image:
  repository: devopstps/platform-service-channel
  pullPolicy: IfNotPresent
  # Override with image digest or tag at deploy time, e.g. --set image.tag=sha-abc123
  tag: "v0.100.1"
nameOverride: ""
fullnameOverride: ""
# ---------------------------------------------------------------------------
# Image pull secrets — name of the dockerhub-pull-secret provisioned by infra
# per namespace. The Secret itself is never committed — infra creates it.
# ---------------------------------------------------------------------------
imagePullSecrets:
  - name: dockerhub-pull-secret
service:
  type: ClusterIP
  port: 8080
  healthPort: 8080
# ---------------------------------------------------------------------------
# Dapr sidecar injection
# The Dapr operator injects the sidecar based on pod annotations below.
# ---------------------------------------------------------------------------
dapr:
  enabled: true
  appId: platform-service-channel
  appPort: "8080"
  sidecarHttpPort: "3500"
  sidecarGrpcPort: "50001"
  logLevel: info
  enableApiLogging: "false"
# ---------------------------------------------------------------------------
# Service-specific ConfigMap  →  platform-service-channel-config
# Source: deploy/.env.prod
# ---------------------------------------------------------------------------
config:
  # NETWORK_NAME: "platform-network"
  # SSL_HTTP_PORT: "8080"
  # SSL_HTTPS_PORT: "8443"
  # CERT_ENV: "prod"
  # DAPR_HTTP_PORT: "3500"
  # DAPR_GRPC_PORT: "50001"
  # DAPR_METRICS_PORT: "9091"
  Cache__StateStoreName: "statestore"
  
  DAPR_SECRET_DB_PATH: "platform-service-channel"
  DAPR_SECRET_KEY1: "postgresql-connectionstring"
  DAPR_SECRET_KEY2: "postgresql-username"
  DAPR_SECRET_KEY3: "postgresql-password"

  Dapr__SecretDbPath: "platform-service-channel"
  Dapr__SecretKeyConnectionString: "postgresql-connectionstring"
  Dapr__SecretKeyUsername: "postgresql-username"
  Dapr__SecretKeyPassword: "postgresql-password"
  
  Swagger__ServerUrl: "/channel/"
  # REDIS_HOST: "redis"
  # REDIS_PORT: "6379"
  # REDIS_PASSWORD: ""

  OTEL_SERVICE_NAME: "platform-service-channel"
  OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES: "platform-service-channel,System.Runtime,Microsoft.AspNetCore.Hosting"
  OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES: "platform-service-channel"
  Serilog__WriteTo__1__Args__resourceAttributes__deployment.environment: production
  Serilog__WriteTo__1__Args__resourceAttributes__service.name: platform-service-channel

# ---------------------------------------------------------------------------
# Infra ConfigMap (pre-existing — populated by the infra namespace pipeline)
# This ConfigMap must exist in the target namespace before deploying.
# Expected keys from deploy/.env.infra:
# - DAPR_SECRET_STORE_NAME
# - DAPR_STATE_STORE_NAME
# - DAPR_PUBSUB_NAME
# - OTEL_EXPORTER_OTLP_ENDPOINT
# - OTEL_EXPORTER_OTLP_PROTOCOL
# - POSTGRES_PORT
# - REDIS_PORT
# - PROMETHEUS_PORT
# - GRAFANA_PORT
# - TEMPO_PORT
# - OTEL_COLLECTOR_GRPC_PORT
# - OTEL_COLLECTOR_HTTP_PORT
# ---------------------------------------------------------------------------
infraConfigMap:
  name: platform-infra-config
# ---------------------------------------------------------------------------
# Resource requests / limits
# ---------------------------------------------------------------------------
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
# ---------------------------------------------------------------------------
# Security contexts (non-root, UID 1001 matching Dockerfile appuser)
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
# ---------------------------------------------------------------------------
# Log volume  (emptyDir, matching /app/logs used by Logback)
# ---------------------------------------------------------------------------
logs:
  enabled: true
  mountPath: /app/logs
# ---------------------------------------------------------------------------
# Grafana Dashboards ConfigMap
# Embeds dashboard JSON directly into ConfigMap for provisioning
# ConfigMap labeled with grafana_dashboard=1 for sidecar discovery
# ---------------------------------------------------------------------------
dashboards:
  enabled: true
# ---------------------------------------------------------------------------
# Liveness / Readiness probes  (Camel health endpoint on healthPort)
# ---------------------------------------------------------------------------
probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
  readiness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
# ---------------------------------------------------------------------------
# Atlas database migrations (managed by atlas-operator)
# atlas.enabled=true generates AtlasMigration CR (sync-wave 0)
# Requires <release-name>-db-credentials Secret in the same namespace.
# ---------------------------------------------------------------------------
atlas:
  enabled: true
