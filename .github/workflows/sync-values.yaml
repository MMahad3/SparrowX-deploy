name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'
jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Detect changes
      # =========================
      - name: Get changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        run: |
          grep '/values\.yaml$' changed.txt > values_changed.txt || true

          if [ ! -s values_changed.txt ]; then
            echo "No values.yaml changes found."
            exit 0
          fi

          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract services
        run: |
          SERVICES=$(echo "$VALUES_FILES" | awk -F'/' '{print $(NF-1)}' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      # =========================
      # Checkout Repo B
      # =========================
      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/SparrowX-helm
          token: ${{ secrets.GH_TOKEN }}
          path: helm-repo

      # =========================
      # Install tools
      # =========================
      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq
          python3 -m pip install --upgrade pip requests ruamel.yaml

      # =========================
      # Extract diff
      # =========================
      - name: Extract YAML diff
        run: |
          echo "[]" > changes.json

          echo "$SERVICES" | tr ' ' '\n' | while read service; do
            FILE_PATH="$service/values.yaml"

            OLD_FILE="old_${service}.yaml"
            NEW_FILE="new_${service}.yaml"

            git show ${{ github.event.before }}:$FILE_PATH > "$OLD_FILE" 2>/dev/null || echo "{}" > "$OLD_FILE"
            cp "$FILE_PATH" "$NEW_FILE"

            yq eval -o=json '.' "$OLD_FILE" > old.json
            yq eval -o=json '.' "$NEW_FILE" > new.json

            jq -r 'paths(scalars) | map(tostring) | join(".")' old.json > old_keys.txt
            jq -r 'paths(scalars) | map(tostring) | join(".")' new.json > new_keys.txt

            cat old_keys.txt new_keys.txt | sort -u > all_keys.txt

            while read key; do
              old_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' old.json)
              new_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' new.json)

                            if [ "$old_val" != "$new_val" ]; then
                                jq --arg service "$service" \
                                    --arg key "$key" \
                                    --arg old "$old_val" \
                                    --arg new "$new_val" \
                                    '. += [{
                                        service: $service,
                                        key: $key,
                                        old_value: $old,
                                        value: $new
                                    }]' changes.json > tmp.json && mv tmp.json changes.json
                            fi
            done < all_keys.txt
          done

          echo "CHANGES:"
          cat changes.json

      # =========================
      # AI or fallback
      # =========================
      - name: AI Transform (with fallback)
        run: |
          python3 -u AI.py

          echo "AI OUTPUT:"
          cat ai_output.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_DEBUG: "1"

      # =========================
      # Apply changes safely
      # =========================
      - name: Apply changes to Helm repo
        run: |
          cd helm-repo

          if ! jq -e 'type == "array"' ../ai_output.json >/dev/null 2>&1; then
            echo "ai_output.json is not a JSON array. Exiting safely."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          from ruamel.yaml import YAML


          def service_to_section(service):
              parts = service.split("-")
              return parts[0] + "".join(p[:1].upper() + p[1:] for p in parts[1:]) + "Service"


          def service_to_camel(service):
              parts = service.split("-")
              return parts[0] + "".join(p[:1].upper() + p[1:] for p in parts[1:])


          def normalize_token(s):
              return "".join(ch for ch in str(s).lower() if ch.isalnum())


          def resolve_service_section(data, service):
              if not isinstance(data, dict):
                  return None

              candidates = []
              camel = service_to_camel(service)
              candidates.append(service_to_section(service))
              candidates.append(camel)
              candidates.append(camel + "Service")
              candidates.append(service.replace("-", ""))
              candidates.append(service)

              for c in candidates:
                  if c in data and isinstance(data[c], (dict, list)):
                      return c

              normalized_service = normalize_token(service)
              matches = []
              for k, v in data.items():
                  if not isinstance(v, (dict, list)):
                      continue
                  nk = normalize_token(k)
                  if nk == normalized_service or nk.startswith(normalized_service) or normalized_service in nk:
                      matches.append(k)

              if len(matches) == 1:
                  return matches[0]

              return None


          def parse_path_parts(path):
              parts = []
              for p in path.split("."):
                  if not p:
                      continue
                  parts.append(int(p) if p.isdigit() else p)
              return parts


          def get_by_path(root, path_parts):
              current = root
              for part in path_parts:
                  if isinstance(part, int):
                      if not isinstance(current, list) or part < 0 or part >= len(current):
                          return False, None
                      current = current[part]
                  else:
                      if not isinstance(current, dict) or part not in current:
                          return False, None
                      current = current[part]
              return True, current


          def set_by_path(root, path_parts, value):
              if not path_parts:
                  return False

              current = root
              for part in path_parts[:-1]:
                  if isinstance(part, int):
                      if not isinstance(current, list) or part < 0 or part >= len(current):
                          return False
                      current = current[part]
                  else:
                      if not isinstance(current, dict) or part not in current:
                          return False
                      current = current[part]

              leaf = path_parts[-1]
              if isinstance(leaf, int):
                  if not isinstance(current, list) or leaf < 0 or leaf >= len(current):
                      return False
                  current[leaf] = value
                  return True

              if not isinstance(current, dict) or leaf not in current:
                  return False
              current[leaf] = value
              return True


          def iter_scalar_paths(node, prefix):
              if isinstance(node, dict):
                  for k, v in node.items():
                      yield from iter_scalar_paths(v, prefix + [k])
                  return

              if isinstance(node, list):
                  for i, v in enumerate(node):
                      yield from iter_scalar_paths(v, prefix + [i])
                  return

              yield prefix, node


          def matches_tail(path_parts, tail):
              if not tail or len(path_parts) < len(tail):
                  return False
              return path_parts[-len(tail):] == tail


          def detect_indent_step(text):
              for raw in text.splitlines():
                  line = raw.rstrip("\n")
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  leading = len(line) - len(line.lstrip(" "))
                  if leading > 0:
                      return leading
              return 2


          file_path = Path("chart/values.yaml")
          changes_path = Path("../ai_output.json")
          source_changes_path = Path("../changes.json")

          if not file_path.exists():
              print("Target file not found: chart/values.yaml")
              sys.exit(1)

          with changes_path.open("r", encoding="utf-8") as f:
              rows = json.load(f)

          source_changes_lookup = {}
          if source_changes_path.exists():
              with source_changes_path.open("r", encoding="utf-8") as f:
                  source_rows = json.load(f)
              for r in source_rows:
                  source_changes_lookup[(r.get("service"), r.get("key"))] = r

          original_text = file_path.read_text(encoding="utf-8")
          indent_step = detect_indent_step(original_text)

          yaml = YAML(typ="rt")
          yaml.preserve_quotes = True
          yaml.indent(mapping=indent_step, sequence=indent_step, offset=0)

          data = yaml.load(original_text) or {}

          applied = 0
          skipped = 0
          for row in rows:
              service = row.get("service")
              key = row.get("key")
              value = row.get("value")

              if not service or not key:
                  print(f"Skipping invalid row: {row}")
                  skipped += 1
                  continue

              service_section = resolve_service_section(data, service)
              if not service_section:
                  print(f"Skipping: service section not found for {service}")
                  skipped += 1
                  continue

              service_root = data[service_section]
              rel_key = key
              service_prefix = f"{service_section}."
              if rel_key.startswith(service_prefix):
                  rel_key = rel_key[len(service_prefix):]

              # Also strip canonical prefixes from source repo style keys.
              canonical_prefixes = [
                  service_to_section(service) + ".",
                  service_to_camel(service) + ".",
              ]
              for prefix in canonical_prefixes:
                  if rel_key.startswith(prefix):
                      rel_key = rel_key[len(prefix):]
                      break

              rel_parts = parse_path_parts(rel_key)

              if not rel_parts:
                  print(f"Skipping empty target key for row: {row}")
                  skipped += 1
                  continue

              source_row = source_changes_lookup.get((service, key), {})
              old_value = source_row.get("old_value")

              direct_exists, _ = get_by_path(service_root, rel_parts)
              chosen_parts = rel_parts if direct_exists else None

              if chosen_parts is None:
                  candidates = []
                  for p, current_value in iter_scalar_paths(service_root, []):
                      if matches_tail(p, rel_parts) or p[-1:] == rel_parts[-1:]:
                          candidates.append((p, current_value))

                  if old_value is not None:
                      old_filtered = [c for c in candidates if c[1] == old_value]
                      if old_filtered:
                          candidates = old_filtered

                  if len(candidates) == 1:
                      chosen_parts = candidates[0][0]
                  elif len(candidates) > 1:
                      print(
                          f"Skipping ambiguous match for {service_section}.{rel_key}: "
                          f"{len(candidates)} candidate paths"
                      )
                      skipped += 1
                      continue

              if chosen_parts is None:
                  print(f"Skipping: no matching path found for {service_section}.{rel_key}")
                  skipped += 1
                  continue

              full_path = [service_section] + chosen_parts
              if not set_by_path(data, full_path, value):
                  print(f"Skipping: failed to set path {full_path}")
                  skipped += 1
                  continue

              dotted = ".".join(str(p) for p in full_path)
              print(f"Updating chart/values.yaml -> {dotted} = {json.dumps(value)}")
              applied += 1

          if applied > 0:
              with file_path.open("w", encoding="utf-8") as f:
                  yaml.dump(data, f)
          else:
              print("No updates were applied; chart/values.yaml was left untouched")

          print(f"Applied {applied} change(s), skipped {skipped} change(s) in chart/values.yaml")
          PY

          git diff

      # =========================
      # Create PR
      # =========================
      - name: Create PR
        run: |
          cd helm-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping branch, push, and PR creation."
            exit 0
          fi

          BRANCH="PLAT/sync-${{ github.sha }}"
          git checkout -b $BRANCH

          git add .

          git commit -m "PLAT: Auto sync from deploy repo"

          git push origin $BRANCH

          gh pr create \
            --title "PLAT: Auto Sync deploy to helm" \
            --body "Automated sync"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}