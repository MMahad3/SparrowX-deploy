name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'
jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Detect changes
      # =========================
      - name: Get changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        run: |
          grep '/values\.yaml$' changed.txt > values_changed.txt || true

          if [ ! -s values_changed.txt ]; then
            echo "No values.yaml changes found."
            exit 0
          fi

          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract services
        run: |
          SERVICES=$(echo "$VALUES_FILES" | awk -F'/' '{print $(NF-1)}' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      # =========================
      # Checkout Repo B
      # =========================
      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/SparrowX-helm
          token: ${{ secrets.GH_TOKEN }}
          path: helm-repo

      # =========================
      # Install tools
      # =========================
      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq
          python3 -m pip install --upgrade pip requests ruamel.yaml

      # =========================
      # Extract diff
      # =========================
      - name: Extract YAML diff
        run: |
          echo "[]" > changes.json

          echo "$SERVICES" | tr ' ' '\n' | while read service; do
            FILE_PATH="$service/values.yaml"

            OLD_FILE="old_${service}.yaml"
            NEW_FILE="new_${service}.yaml"

            git show ${{ github.event.before }}:$FILE_PATH > "$OLD_FILE" 2>/dev/null || echo "{}" > "$OLD_FILE"
            cp "$FILE_PATH" "$NEW_FILE"

            yq eval -o=json '.' "$OLD_FILE" > old.json
            yq eval -o=json '.' "$NEW_FILE" > new.json

            jq -r 'paths(scalars) | map(tostring) | join(".")' old.json > old_keys.txt
            jq -r 'paths(scalars) | map(tostring) | join(".")' new.json > new_keys.txt

            cat old_keys.txt new_keys.txt | sort -u > all_keys.txt

            while read key; do
              old_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' old.json)
              new_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' new.json)

              if [ "$old_val" != "$new_val" ]; then
                jq --arg service "$service" \
                   --arg key "$key" \
                   --arg new "$new_val" \
                   '. += [{
                      service: $service,
                      key: $key,
                      value: $new
                   }]' changes.json > tmp.json && mv tmp.json changes.json
              fi
            done < all_keys.txt
          done

          echo "CHANGES:"
          cat changes.json

      # =========================
      # AI or fallback
      # =========================
      - name: AI Transform (with fallback)
        run: |
          python3 -u AI.py

          echo "AI OUTPUT:"
          cat ai_output.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_DEBUG: "1"

      # =========================
      # Apply changes safely
      # =========================
      - name: Apply changes to Helm repo
        run: |
          cd helm-repo

          if ! jq -e 'type == "array"' ../ai_output.json >/dev/null 2>&1; then
            echo "ai_output.json is not a JSON array. Exiting safely."
            exit 0
          fi

            python3 - <<'PY'
            import json
            import sys
            from pathlib import Path
            from ruamel.yaml import YAML


            def service_to_section(service):
              parts = service.split("-")
              return parts[0] + "".join(p[:1].upper() + p[1:] for p in parts[1:]) + "Service"


            def set_path(root, path_parts, value):
              current = root
              for part in path_parts[:-1]:
                if part not in current or current[part] is None:
                  current[part] = {}
                current = current[part]
              current[path_parts[-1]] = value


            file_path = Path("chart/values.yaml")
            changes_path = Path("../ai_output.json")

            if not file_path.exists():
              print("Target file not found: chart/values.yaml")
              sys.exit(1)

            with changes_path.open("r", encoding="utf-8") as f:
              rows = json.load(f)

            yaml = YAML()
            yaml.preserve_quotes = True
            yaml.width = 4096

            with file_path.open("r", encoding="utf-8") as f:
              data = yaml.load(f) or {}

            applied = 0
            for row in rows:
              service = row.get("service")
              key = row.get("key")
              value = row.get("value")

              if not service or not key:
                print(f"Skipping invalid row: {row}")
                continue

              service_section = service_to_section(service)
              target_key = key if key.startswith(f"{service_section}.") else f"{service_section}.{key}"
              path_parts = [p for p in target_key.split(".") if p]

              if not path_parts:
                print(f"Skipping empty target key for row: {row}")
                continue

              print(f"Updating chart/values.yaml -> {target_key} = {json.dumps(value)}")
              set_path(data, path_parts, value)
              applied += 1

            with file_path.open("w", encoding="utf-8") as f:
              yaml.dump(data, f)

            print(f"Applied {applied} change(s) to chart/values.yaml")
            PY

          git diff

      # =========================
      # Create PR
      # =========================
      - name: Create PR
        run: |
          cd helm-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping branch, push, and PR creation."
            exit 0
          fi

          BRANCH="PLAT/sync-${{ github.sha }}"
          git checkout -b $BRANCH

          git add .

          git commit -m "PLAT: Auto sync from deploy repo"

          git push origin $BRANCH

          gh pr create \
            --title "PLAT: Auto Sync deploy to helm" \
            --body "Automated sync"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}