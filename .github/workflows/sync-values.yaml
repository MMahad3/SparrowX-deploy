name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        run: |
          echo "Changed files:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        id: filter
        run: |
          if ! grep -E '/values\.yaml$' changed.txt > values_changed.txt; then
            : > values_changed.txt
          fi
          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Debug output
        run: |
          echo "Changed values files:"
          echo "$VALUES_FILES"

      - name: Extract service names
        id: extract
        run: |
          SERVICES=$(printf "%s\n" "$VALUES_FILES" | awk -F'/' 'NF { print $1 }' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      - name: Validate Helm repo token
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "GH_TOKEN secret is missing or empty."
            echo "Add GH_TOKEN with repo read/write access to TPSWorldwide/sparrowx-helm in repository or org secrets."
            exit 1
          fi

      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: TPSWorldwide/sparrowx-helm
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          path: helm-repo


      - name: Show structure
        run: |
          ls -R helm-repo