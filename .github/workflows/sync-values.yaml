name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        run: |
          echo "Changed files:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        id: filter
        run: |
          if ! grep -E '/values\.yaml$' changed.txt > values_changed.txt; then
            : > values_changed.txt
          fi
          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Debug output
        run: |
          echo "Changed values files:"
          echo "$VALUES_FILES"

      - name: Extract service names
        id: extract
        run: |
          SERVICES=$(printf "%s\n" "$VALUES_FILES" | awk -F'/' 'NF { print $1 }' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      - name: Validate Helm repo token
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "GH_TOKEN secret is missing or empty."
            echo "Add GH_TOKEN with repo read/write access to MMahad3/sparrowx-helm in repository or org secrets."
            exit 1
          fi

      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/sparrowx-helm
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          path: helm-repo


      - name: Show structure
        run: |
          ls -R helm-repo


      - name: Exit if no values.yaml changed
        if: env.VALUES_FILES == ''
        run: |
          echo "No values.yaml changes detected. Exiting."
          exit 0

      - name: Debug services
        run: |
          echo "Services detected:"
          echo "$SERVICES"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

        
      - name: Extract YAML changes
        run: |
          echo "Processing services..."

          for service in $SERVICES; do
            echo "---- Service: $service ----"

            FILE_PATH="$service/values.yaml"

            # Get old version
            git show ${{ github.event.before }}:$FILE_PATH > old.yaml || echo "{}" > old.yaml

            # Get new version
            cp $FILE_PATH new.yaml

            echo "Old YAML:"
            cat old.yaml
            echo "New YAML:"
            cat new.yaml

            # Flatten both YAMLs
            yq eval 'paths | join(".")' old.yaml | while read key; do
              old_val=$(yq eval ".$key" old.yaml)
              new_val=$(yq eval ".$key" new.yaml)

              if [ "$old_val" != "$new_val" ]; then
                echo "Changed: $key | $old_val → $new_val"
              fi
            done

            echo "--------------------------"
          done