name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - main
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.extract_services.outputs.services }}

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Detect changes
      # =========================
      - name: Get changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        run: |
          grep '/values\.yaml$' changed.txt > values_changed.txt || true

          if [ ! -s values_changed.txt ]; then
            echo "No values.yaml changes found."
            exit 0
          fi

          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract services
        id: extract_services
        run: |
          SERVICES=$(echo "$VALUES_FILES" | awk -F'/' '{print $(NF-1)}' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

  extract-diff:
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Install tools
      # =========================
      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      # =========================
      # Extract diff
      # =========================
      - name: Extract YAML diff
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          echo "[]" > changes.json

          safe_yq_to_json() {
            local input_file="$1"
            local output_file="$2"

            # If YAML is malformed in either old or new file, continue with empty object.
            if ! yq eval -o=json '.' "$input_file" > "$output_file" 2>/dev/null; then
              echo "Warning: could not parse $input_file as YAML; defaulting to {}"
              echo "{}" > "$output_file"
            fi
          }

          echo "$SERVICES" | tr ' ' '\n' | while IFS= read -r service; do
            [ -z "$service" ] && continue

            FILE_PATH="$service/values.yaml"

            OLD_FILE="old_${service}.yaml"
            NEW_FILE="new_${service}.yaml"

            git show ${{ github.event.before }}:$FILE_PATH > "$OLD_FILE" 2>/dev/null || echo "{}" > "$OLD_FILE"
            cp "$FILE_PATH" "$NEW_FILE"

            safe_yq_to_json "$OLD_FILE" old.json
            safe_yq_to_json "$NEW_FILE" new.json

            jq -r 'paths(scalars) | map(tostring) | join(".")' old.json > old_keys.txt
            jq -r 'paths(scalars) | map(tostring) | join(".")' new.json > new_keys.txt

            cat old_keys.txt new_keys.txt | sort -u > all_keys.txt

            while IFS= read -r key; do
              old_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' old.json)
              new_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' new.json)

              if [ "$old_val" != "$new_val" ]; then
                jq --arg service "$service" \
                  --arg key "$key" \
                  --arg old "$old_val" \
                  --arg new "$new_val" \
                  '. += [{
                    service: $service,
                    key: $key,
                    old_value: $old,
                    value: $new
                  }]' changes.json > tmp.json && mv tmp.json changes.json
              fi
            done < all_keys.txt
          done

          echo "CHANGES:"
          cat changes.json

      - name: Upload changes artifact
        uses: actions/upload-artifact@v4
        with:
          name: changes-json
          path: changes.json

  ai-transform:
    runs-on: ubuntu-latest
    needs: extract-diff

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download changes artifact
        uses: actions/download-artifact@v4
        with:
          name: changes-json
          path: .

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip requests ruamel.yaml

      # =========================
      # AI or fallback
      # =========================
      - name: AI Transform (with fallback)
        run: |
          python3 -u scripts/AI.py

          echo "AI OUTPUT:"
          cat ai_output.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_DEBUG: "1"

      - name: Upload AI output artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-output-json
          path: ai_output.json

  apply-and-pr:
    runs-on: ubuntu-latest
    needs: ai-transform

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          path: deploy-repo

      # =========================
      # Checkout Repo B
      # =========================
      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/SparrowX-helm
          token: ${{ secrets.GH_TOKEN }}
          path: helm-repo

      - name: Download changes artifact
        uses: actions/download-artifact@v4
        with:
          name: changes-json
          path: .

      - name: Download AI output artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-output-json
          path: .

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          python3 -m pip install --upgrade pip ruamel.yaml

      # =========================
      # Apply changes safely
      # =========================
      - name: Apply changes to Helm repo
        run: |
          cd helm-repo

          if ! jq -e 'type == "array"' ../ai_output.json >/dev/null 2>&1; then
            echo "ai_output.json is not a JSON array. Exiting safely."
            exit 0
          fi

          python3 ../deploy-repo/scripts/apply_ai_changes.py

      # =========================
      # Create PR
      # =========================
      - name: Create PR
        run: |
          cd helm-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping branch, push, and PR creation."
            exit 0
          fi

          BRANCH="PLAT/sync-${{ github.sha }}"
          git checkout -b $BRANCH

          git add .

          git commit -m "PLAT: Auto sync from deploy repo"

          git push origin $BRANCH

          gh pr create \
            --title "PLAT: Auto Sync deploy to helm" \
            --body "Automated sync"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}