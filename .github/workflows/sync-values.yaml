name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Detect changes
      # =========================
      - name: Get changed files
        run: |
          echo "Changed files:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        run: |
          grep '/values\.yaml$' changed.txt > values_changed.txt || true

          if [ ! -s values_changed.txt ]; then
            echo "No values.yaml changes found."
            exit 0
          fi

          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract services
        run: |
          SERVICES=$(echo "$VALUES_FILES" | awk -F'/' '{print $(NF-1)}' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      # =========================
      # Checkout Repo B (Helm)
      # =========================
      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/SparrowX-helm
          token: ${{ secrets.GH_TOKEN }}
          path: helm-repo

      # =========================
      # Install tools
      # =========================
      - name: Install yq + jq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      # =========================
      # Generate structured diff
      # =========================
      - name: Extract YAML diff
        run: |
          echo "[]" > changes.json

          echo "$SERVICES" | tr ' ' '\n' | while read service; do
            echo "Processing: $service"

            FILE_PATH="$service/values.yaml"

            OLD_FILE="old_${service}.yaml"
            NEW_FILE="new_${service}.yaml"

            # Old version
            git show ${{ github.event.before }}:$FILE_PATH > "$OLD_FILE" 2>/dev/null || echo "{}" > "$OLD_FILE"

            # New version
            cp "$FILE_PATH" "$NEW_FILE"

            # Convert YAML to JSON once, then use jq for stable path extraction
            yq eval -o=json '.' "$OLD_FILE" > old.json
            yq eval -o=json '.' "$NEW_FILE" > new.json

            # Extract scalar key paths
            jq -r 'paths(scalars) | map(tostring) | join(".")' old.json > old_keys.txt
            jq -r 'paths(scalars) | map(tostring) | join(".")' new.json > new_keys.txt

            cat old_keys.txt new_keys.txt | sort -u > all_keys.txt

            while read key; do
              old_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' old.json)
              new_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' new.json)

              if [ "$old_val" != "$new_val" ]; then
                echo "Changed: $key | $old_val -> $new_val"

                jq --arg service "$service" \
                   --arg key "$key" \
                   --arg old "$old_val" \
                   --arg new "$new_val" \
                   '. += [{
                      service: $service,
                      key: $key,
                      old: $old,
                      new: $new
                   }]' changes.json > tmp.json && mv tmp.json changes.json
              fi
            done < all_keys.txt

          done

          echo "FINAL DIFF:"
          cat changes.json

      # =========================
      # AI Transformation Layer
      # =========================
      - name: AI Transform Changes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Calling AI..."

          PROMPT=$(cat <<EOF
          You are a DevOps configuration engine.

          Rules:
          - Only modify VALUES, never keys or structure
          - If env is QA:
            - ensure replicaCount >= 2
            - apply test_ prefix if required
          - Ensure OKD compatibility
          - Return STRICT JSON only:
          [
            {
              "service": "",
              "key": "",
              "value": ""
            }
          ]

          INPUT:
          $(cat changes.json)
          EOF
          )

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a strict DevOps transformer.\"},
                {\"role\": \"user\", \"content\": \"$PROMPT\"}
              ],
              \"temperature\": 0
            }")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > ai_output.json

          echo "AI OUTPUT:"
          cat ai_output.json

      # =========================
      # Apply AI changes to Helm repo
      # =========================
      - name: Apply changes to Helm repo
        run: |
          cd helm-repo

          echo "Applying AI changes..."

          for row in $(cat ../ai_output.json | jq -c '.[]'); do
            service=$(echo $row | jq -r '.service')
            key=$(echo $row | jq -r '.key')
            value=$(echo $row | jq -r '.value')

            FILE="$service/values.yaml"

            echo "Updating $FILE -> $key = $value"

            yq eval ".$key = \"$value\"" -i "$FILE"
          done

          git diff

      # =========================
      # Create PR in Repo B
      # =========================
      - name: Create PR in Helm repo
        run: |
          cd helm-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          BRANCH="auto/ai-sync-${{ github.sha }}"

          git checkout -b $BRANCH

          git add .
          git commit -m "AI-driven sync from sparrowx-deploy"

          git push origin $BRANCH

          gh pr create \
            --title "AI Sync: sparrowx-deploy → sparrowx-helm" \
            --body "Automated AI-based values sync"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}