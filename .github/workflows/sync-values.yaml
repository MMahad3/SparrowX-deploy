name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout Repo A
      # =========================
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Detect changes
      # =========================
      - name: Get changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        run: |
          grep '/values\.yaml$' changed.txt > values_changed.txt || true

          if [ ! -s values_changed.txt ]; then
            echo "No values.yaml changes found."
            exit 0
          fi

          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract services
        run: |
          SERVICES=$(echo "$VALUES_FILES" | awk -F'/' '{print $(NF-1)}' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      # =========================
      # Checkout Repo B
      # =========================
      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/SparrowX-helm
          token: ${{ secrets.GH_TOKEN }}
          path: helm-repo

      # =========================
      # Install tools
      # =========================
      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      # =========================
      # Extract diff
      # =========================
      - name: Extract YAML diff
        run: |
          echo "[]" > changes.json

          echo "$SERVICES" | tr ' ' '\n' | while read service; do
            FILE_PATH="$service/values.yaml"

            OLD_FILE="old_${service}.yaml"
            NEW_FILE="new_${service}.yaml"

            git show ${{ github.event.before }}:$FILE_PATH > "$OLD_FILE" 2>/dev/null || echo "{}" > "$OLD_FILE"
            cp "$FILE_PATH" "$NEW_FILE"

            yq eval -o=json '.' "$OLD_FILE" > old.json
            yq eval -o=json '.' "$NEW_FILE" > new.json

            jq -r 'paths(scalars) | map(tostring) | join(".")' old.json > old_keys.txt
            jq -r 'paths(scalars) | map(tostring) | join(".")' new.json > new_keys.txt

            cat old_keys.txt new_keys.txt | sort -u > all_keys.txt

            while read key; do
              old_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' old.json)
              new_val=$(jq -c --arg key "$key" 'getpath($key | split(".") | map(tonumber? // .)) // "__MISSING__"' new.json)

              if [ "$old_val" != "$new_val" ]; then
                jq --arg service "$service" \
                   --arg key "$key" \
                   --arg new "$new_val" \
                   '. += [{
                      service: $service,
                      key: $key,
                      value: $new
                   }]' changes.json > tmp.json && mv tmp.json changes.json
              fi
            done < all_keys.txt
          done

          echo "CHANGES:"
          cat changes.json

      # =========================
      # AI or fallback
      # =========================
      - name: AI Transform (with fallback)
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "No API key → using fallback"
            cp changes.json ai_output.json
          else
            echo "Calling AI..."

            RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"gpt-4o-mini\",
                \"messages\": [
                  {\"role\": \"system\", \"content\": \"Modify only values.\"},
                  {\"role\": \"user\", \"content\": \"$(cat changes.json)\"}
                ],
                \"temperature\": 0
              }")

            echo "$RESPONSE" | jq -r '.choices[0].message.content' > ai_output.json
          fi

          echo "AI OUTPUT:"
          cat ai_output.json

      # =========================
      # Apply changes safely
      # =========================
      - name: Apply changes to Helm repo
        run: |
          cd helm-repo

          jq -c '.[]' ../ai_output.json | while read row; do
            service=$(echo "$row" | jq -r '.service')
            key=$(echo "$row" | jq -r '.key')
            value=$(echo "$row" | jq -r '.value')

            FILE="$service/values.yaml"

            echo "Updating $FILE -> $key = $value"

            yq eval ".$key = $value" -i "$FILE"
          done

          git diff

      # =========================
      # Create PR
      # =========================
      - name: Create PR
        run: |
          cd helm-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          BRANCH="auto/sync-${{ github.sha }}"
          git checkout -b $BRANCH

          git add .
          git commit -m "Auto sync from deploy repo" || echo "No changes to commit"

          git push origin $BRANCH

          gh pr create \
            --title "Auto Sync: deploy → helm" \
            --body "Automated sync"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}