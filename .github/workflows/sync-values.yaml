name: Sync values to sparrowx-helm

on:
  push:
    branches:
      - Feature/values-syncing
    paths:
      - '**/values.yaml'
      - '!.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A (deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          echo "Changed files:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

      - name: Filter values.yaml files
        run: |
          grep '/values\.yaml$' changed.txt > values_changed.txt || true

          if [ ! -s values_changed.txt ]; then
            echo "No values.yaml changes found."
            exit 0
          fi

          echo "VALUES_FILES<<EOF" >> $GITHUB_ENV
          cat values_changed.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Debug changed values files
        run: |
          echo "$VALUES_FILES"

      - name: Extract service names
        run: |
          SERVICES=$(echo "$VALUES_FILES" | awk -F'/' '{print $(NF-1)}' | sort -u | xargs)
          echo "SERVICES=$SERVICES" >> $GITHUB_ENV

      - name: Validate Helm repo token
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "GH_TOKEN is missing"
            exit 1
          fi

      - name: Checkout Repo B (helm)
        uses: actions/checkout@v4
        with:
          repository: MMahad3/sparrowx-helm
          token: ${{ secrets.GH_TOKEN }}
          path: helm-repo

      - name: Show Repo B structure
        run: |
          ls -R helm-repo

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract YAML diff (AI-ready structured output)
        run: |
          echo "Processing services..."

          CHANGES_FILE="changes.json"
          echo "[]" > $CHANGES_FILE

          echo "$SERVICES" | tr ' ' '\n' | while read service; do
            echo "---- Service: $service ----"

            FILE_PATH="$service/values.yaml"

            OLD_FILE="old_${service}.yaml"
            NEW_FILE="new_${service}.yaml"

            # Get old version safely
            git show ${{ github.event.before }}:$FILE_PATH > "$OLD_FILE" || echo "" > "$OLD_FILE"

            # Get new version
            cp "$FILE_PATH" "$NEW_FILE"

            # Extract full key paths safely
            yq eval '.. | select(tag == "!!str" or tag == "!!int" or tag == "!!bool") | path | join(".")' "$OLD_FILE" > old_keys.txt
            yq eval '.. | select(tag == "!!str" or tag == "!!int" or tag == "!!bool") | path | join(".")' "$NEW_FILE" > new_keys.txt

            cat old_keys.txt new_keys.txt | sort -u > all_keys.txt

            while read key; do
              old_val=$(yq eval ".$key // \"__MISSING__\"" "$OLD_FILE" 2>/dev/null)
              new_val=$(yq eval ".$key // \"__MISSING__\"" "$NEW_FILE" 2>/dev/null)

              if [ "$old_val" != "$new_val" ]; then
                echo "Changed: $key | $old_val -> $new_val"

                # Build JSON (AI-ready contract)
                jq --arg service "$service" \
                   --arg key "$key" \
                   --arg old "$old_val" \
                   --arg new "$new_val" \
                   '. += [{
                      service: $service,
                      key: $key,
                      old: $old,
                      new: $new
                   }]' $CHANGES_FILE > tmp.json && mv tmp.json $CHANGES_FILE
              fi
            done < all_keys.txt

            echo "--------------------------"
          done

          echo "FINAL DIFF:"
          cat $CHANGES_FILE