# =============================================================================
# Default values for platform-back-office.
# Auto-generated by helm generation for Platform X Back-Office Portal
# =============================================================================

replicaCount: 1

image:
  repository: devopstps/platform-backoffice
  pullPolicy: IfNotPresent
  tag: "v0.1.100"   # override with --set image.tag=sha-abc123 at deploy time

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: dockerhub-pull-secret   # provisioned by infra; never committed

service:
  type: ClusterIP
  port: 3051
  healthPort: 3051   # health is on the same endpoint as main port

# Next.js does NOT use Dapr — this is a frontend application
dapr:
  enabled: false

# Service-specific env vars — sourced from deploy/.env.production
# NEVER put secrets here; secrets are handled via external secret management in infra.
# Key names from deploy/.env.infra are documented as comments only — consumed from 
# pre-existing infra ConfigMap at runtime.
config:
  NODE_ENV: "production"
  PORT: "3051"
  NEXTAUTH_TRUST_HOST: "true"
  NEXTAUTH_DEBUG: "true"
  MAIN_APP_PORT: "3051"
  # Few additional env vars are injected via deployment.yaml 
  # because they require valueFrom references to ConfigMaps and Secrets
  # (e.g. NOTIFICATION_GATEWAY_URL, which is sourced from application-services ConfigMap)

infraConfigMap:
  name: platform-infra-config

resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "500m"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

logs:
  enabled: false   # Next.js writes to stdout; no need for volume mount

# Probe paths — Next.js health check endpoint
probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
  readiness:
    path: /api/health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Atlas is not used — this is a frontend app, no database
atlas:
  enabled: false